name: Repository activity card

on:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repo-activity.yml"
      - "profile/README.md"
      - "scripts/update_repo_activity.py"
      - "assets/repo-activity/index.html"
      - "assets/repo-activity/render.mjs"
      - "assets/repo-activity/render_svg.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update activity data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repo_activity.py
      - name: Render SVG from HTML renderer data
        run: node assets/repo-activity/render_svg.mjs
      - name: Commit generated activity card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/repo-activity/data.json assets/repo-activity.svg
          if git diff --cached --quiet; then
            echo "No activity changes"
            exit 0
          fi
          git commit -m "chore: update repository activity card"
          git push
