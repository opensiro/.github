<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenSiro / repository activity</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #f6f8fa; }
  body {
    display: grid;
    place-items: center;
    padding: 32px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  #mount {
    width: min(900px, 100%);
    filter: drop-shadow(0 8px 28px rgb(31 35 40 / 7%));
  }
  #mount svg { display: block; width: 100%; height: auto; }
  .error {
    width: min(900px, 100%);
    padding: 24px;
    border: 1px solid #d0d7de;
    border-radius: 14px;
    background: #fff;
    color: #cf222e;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
</style>
</head>
<body>
<div id="mount" aria-live="polite"></div>
<script type="module">
  import { buildSvg } from './render.mjs';
  const mount = document.querySelector('#mount');
  try {
    const response = await fetch('./data.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`data.json: HTTP ${response.status}`);
    const data = await response.json();
    mount.innerHTML = buildSvg(data);
  } catch (error) {
    mount.outerHTML = `<pre class="error">${String(error)}</pre>`;
  }
</script>
</body>
</html>
