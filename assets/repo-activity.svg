<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
  <title id="title">OpenSiro VSM Harness repository activity</title>
  <desc id="desc">GitHub activity for the five repositories in the bounded OpenSiro VSM OSS organization, the adjacent experimental VSM Harness Capability repository, and the private VSM Harness Research repository for 2026-09-20 - 2026-09-29. The vertical axis is logarithmic: powers of ten are equally spaced, with per-repository track ticks at 2x and 5x subdivisions plus the geometric midpoint of each decade for visual estimation. Opaque overlapping bars show commit, pull request, and issue activity. Equal values are separated horizontally rather than merged.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #18181b; }
    .frame { fill: #ffffff; stroke: #d0d7de; }
    .track { stroke: #d8dee4; stroke-width: 1; stroke-dasharray: 2 4; }
    .track-tick { stroke: #8c959f; stroke-width: 0.8; stroke-linecap: round; shape-rendering: crispEdges; pointer-events: none; }
    .track-tick.midpoint { stroke-width: 0.9; }
    .track-tick.major { stroke-width: 1; }
    .grid { stroke: #d8dee4; stroke-width: 1; stroke-dasharray: 4 5; }
    .axis { stroke: #57606a; stroke-width: 1; }
    .axis-label { font-size: 8px; fill: #6e7781; }
    .bar { stroke: #ffffff; stroke-width: 1; shape-rendering: crispEdges; }
    .commits { fill: #2f81f7; }
    .prs { fill: #2da44e; }
    .issues { fill: #bf8700; }
    .repo-label { font-size: 10px; font-weight: 700; }
    .scope-label { font-size: 7px; fill: #8c959f; letter-spacing: 0.4px; }
    .scope-boundary { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 4; }
    .muted { fill: #6e7781; }
    .legend-label { font-size: 9px; }
  </style>
