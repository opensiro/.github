<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
<title id="title">OpenSiro VSM Harness repository activity</title>
<desc id="desc">GitHub activity for the five repositories in the bounded OpenSiro VSM OSS organization plus the adjacent experimental VSM Harness Capability repository for 2026-09-20 - 2026-09-29. The vertical axis is logarithmic: 1, 10, 100, and 1000 are equally spaced. Opaque overlapping bars show commit, pull request, and issue activity. Equal values are separated horizontally rather than merged.</desc>
